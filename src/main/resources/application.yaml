spring:
  application:
    name: sb15-deokhugam-team1
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5433/deokhugam_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
kakao:
  # 카카오 디벨로퍼스 REST API 키. 깃에 올리지 말고 환경변수로만 넣는다
  rest-api-key: ${KAKAO_REST_API_KEY:}
  base-url: https://dapi.kakao.com
ocr-space:
  # OCR.space API 키. 깃에 올리지 말고 환경변수로만 넣는다
  api-key: ${OCR_SPACE_API_KEY:}
  base-url: https://api.ocr.space
