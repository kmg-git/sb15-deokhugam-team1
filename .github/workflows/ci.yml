
name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    # CI 전용 PostgreSQL 데이터베이스
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deokhugam_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d deokhugam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 테스트 전용 DB 접속 설정
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/deokhugam_test
      SPRING_DATASOURCE_USERNAME: test_user
      SPRING_DATASOURCE_PASSWORD: test_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: 테스트 및 JaCoCo 실행
        run: ./gradlew check jacocoTestReport -x jacocoTestCoverageVerification

      - name: JaCoCo 커버리지 Codecov 업로드
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
